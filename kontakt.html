<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt – Elektro Lumi GmbH | Elektriker in Brugg, Aargau</title>
    <meta
      name="description"
      content="Kontaktieren Sie die Elektro Lumi GmbH in Brugg (Aargau) für Elektroinstallationen. Schreiben Sie uns Ihr Anliegen – wir melden uns so rasch wie möglich bei Ihnen zurück."
    />
    <link rel="canonical" href="https://www.elektrolumi.ch/kontakt.html" />
    <meta name="theme-color" content="#1e5a73" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elektro Lumi GmbH" />
    <meta property="og:locale" content="de_CH" />
    <meta
      property="og:title"
      content="Kontakt – Elektro Lumi GmbH | Elektriker in Brugg, Aargau"
    />
    <meta
      property="og:description"
      content="Elektro Lumi GmbH, Badstrasse 25, 5200 Brugg – Ihr Elektriker für Elektroinstallationen in Brugg und Umgebung."
    />
    <meta property="og:url" content="https://www.elektrolumi.ch/kontakt.html" />
    <meta
      property="og:image"
      content="https://www.elektrolumi.ch/assets/images/hero-img1.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/icons/logo-footer3.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/kontakt.css" />
  </head>

  <body>
    <!-- header injection -->
    <header id="main-header"></header>

    <main class="wrap kontakt">
      <section class="kontakt-intro">
        <p class="eyebrow">Elektro Lumi GmbH</p>
        <h1>Kontakt</h1>
        <p>
          Schreiben Sie uns Ihr Anliegen. Wir melden uns so rasch wie möglich
          bei Ihnen zurück.
        </p>
      </section>

      <!--
        Web3Forms: leitet die Übermittlung als E-Mail weiter.
        Der access_key gehört zu dondraper52@hotmail.com (TEST) – für die
        Produktion einen neuen Key für info@elektrolumi.ch generieren.
      -->
      <form
        id="kontakt-form"
        class="kontakt-form"
        action="https://api.web3forms.com/submit"
        method="POST"
      >
        <input
          type="hidden"
          name="access_key"
          value="922a542d-a251-44e9-8042-786179938a63"
        />
        <input
          type="hidden"
          name="subject"
          value="Neue Anfrage über elektrolumi.ch"
        />
        <input
          type="hidden"
          name="from_name"
          value="elektrolumi.ch Kontaktformular"
        />
        <!-- Honeypot-Spamfalle (Web3Forms): für Menschen unsichtbar -->
        <input
          type="checkbox"
          name="botcheck"
          class="kontakt-honey"
          tabindex="-1"
          autocomplete="off"
        />

        <div class="form-field">
          <label for="firma"
            >Firma <span class="optional">(optional)</span></label
          >
          <input
            type="text"
            id="firma"
            name="Firma"
            autocomplete="organization"
          />
        </div>

        <div class="form-field">
          <label for="name">Name *</label>
          <input
            type="text"
            id="name"
            name="Name"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="email">E-Mail *</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-field">
            <label for="telefon"
              >Telefon <span class="optional">(optional)</span></label
            >
            <input type="tel" id="telefon" name="Telefon" autocomplete="tel" />
          </div>
        </div>

        <fieldset class="form-objekt">
          <legend>Objekt</legend>
          <div class="form-field">
            <label for="objekt">Objekt</label>
            <input
              type="text"
              id="objekt"
              name="Objekt"
              placeholder="z. B. Mehrfamilienhaus, Wohnung"
            />
          </div>
          <div class="form-field">
            <label for="objektort">Objektort</label>
            <input type="text" id="objektort" name="Objektort" />
          </div>
        </fieldset>

        <div class="form-field">
          <label for="nachricht">Nachricht *</label>
          <textarea
            id="nachricht"
            name="Nachricht"
            rows="6"
            required
          ></textarea>
        </div>

        <!-- Spam-Schutz: hCaptcha (Web3Forms-Proxy, kein eigener Sitekey nötig) -->
        <div class="h-captcha" data-captcha="true" data-lang="de"></div>

        <button type="submit" class="kontakt-submit">Anfrage senden</button>

        <p
          id="kontakt-result"
          class="kontakt-result"
          role="status"
          aria-live="polite"
        ></p>
      </form>
    </main>

    <!-- footer injection -->
    <footer id="footer"></footer>

    <!-- header script -->
    <script src="js/ham-menu-loader.js"></script>
    <script src="js/header-loader.js"></script>
    <script src="js/footer-loader.js"></script>

    <!-- Web3Forms client (rendert hCaptcha) + Formular-Logik -->
    <script src="https://web3forms.com/client/script.js" async defer></script>
    <script src="js/kontakt-form.js"></script>
  </body>
</html>
